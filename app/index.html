<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1f1f">
  <title>Practice Room</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Practice Room">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <nav class="bar" role="tablist" aria-label="Apps" data-i18n-attr="aria-label:apps">
      <div class="slot" data-app="metronome">
        <button class="tab" role="tab" id="tab-metronome" aria-label="Metronome" data-i18n-attr="aria-label:metronome" aria-controls="pane-metronome" aria-selected="false">
          <span class="name"><i class="led"></i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l4 18H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 17 16 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="14.7" cy="10" r="1.6" fill="currentColor"/></svg><span class="label" data-i18n="metronome">Metronome</span></span>
          <span class="info" data-info></span>
        </button>
        <button class="vol" type="button" aria-label="Metronome volume" aria-haspopup="true" aria-expanded="false" title="Metronome volume"><svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.500v5h4l5 4v-13l-5 4z" fill="currentColor"/><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.500 6.500a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="play" type="button" aria-label="Play metronome" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        </button>
      </div>

      <div class="slot" data-app="drone">
        <button class="tab" role="tab" id="tab-drone" aria-label="Drone/Tuner" data-i18n-attr="aria-label:droneTuner" aria-controls="pane-drone" aria-selected="false">
          <span class="name"><i class="led"></i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3v8a3.5 3.5 0 0 0 7 0V3M12 14.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label" data-i18n="droneTuner">Drone/Tuner</span></span>
          <span class="info" data-info></span>
        </button>
        <button class="vol" type="button" aria-label="Drone volume" aria-haspopup="true" aria-expanded="false" title="Drone volume"><svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.500v5h4l5 4v-13l-5 4z" fill="currentColor"/><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.500 6.500a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="play" type="button" aria-label="Play drone" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        </button>
      </div>

      <div class="slot" data-app="player">
        <button class="tab" role="tab" id="tab-player" aria-label="Player" data-i18n-attr="aria-label:player" aria-controls="pane-player" aria-selected="false">
          <span class="name"><i class="led"></i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h1.5M7 8v8M10.5 4.500v15M14 7v10M17.500 9.500v5M21 12h-.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="label" data-i18n="player">Player</span></span>
          <span class="info" data-info></span>
        </button>
        <button class="vol" type="button" aria-label="Player volume" aria-haspopup="true" aria-expanded="false" title="Player volume"><svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.500v5h4l5 4v-13l-5 4z" fill="currentColor"/><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.500 6.500a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="play" type="button" aria-label="Play player" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        </button>
      </div>
    </nav>

    <div class="volpop" id="volpop" role="group" aria-label="Volume" data-i18n-attr="aria-label:volume" hidden>
      <span class="volname" id="volname"></span>
      <input id="volrange" type="range" min="0" max="100" step="1" aria-label="Volume" data-i18n-attr="aria-label:volume">
      <output id="volout"></output>
    </div>

    <main class="panes">
      <iframe id="pane-metronome" data-app="metronome" role="tabpanel" aria-labelledby="tab-metronome"
              src="metronome/index.html" title="Metronome" data-i18n-attr="title:metronome" allow="autoplay; screen-wake-lock"></iframe>
      <iframe id="pane-drone" data-app="drone" role="tabpanel" aria-labelledby="tab-drone"
              src="drone/index.html" title="Drone" data-i18n-attr="title:drone" allow="autoplay; microphone; screen-wake-lock"></iframe>
      <iframe id="pane-player" data-app="player" role="tabpanel" aria-labelledby="tab-player"
              src="player/index.html" title="Player" data-i18n-attr="title:player" allow="autoplay; microphone; screen-wake-lock"></iframe>
    </main>

    <footer class="copyright"><span class="lang-pick"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.500 2.700 3.700 5.700 3.700 9s-1.200 6.300-3.700 9c-2.500-2.700-3.700-5.700-3.700-9S9.500 5.700 12 3z"/></svg><span class="lang-code" id="langCode" aria-hidden="true">EN</span><select id="langSel" aria-label="Language" data-i18n-attr="aria-label:language"><option value="en">English</option><option value="it">Italiano</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></span> &middot; <button type="button" class="linklike" id="themeBtn"><svg class="i-moon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="theme-label" id="themeLabel"></span></button> &middot; <button type="button" class="linklike" id="shareBtn" aria-haspopup="dialog"><span data-i18n="share">Share</span><svg class="share-ico" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button><span class="credits-link"> &middot; <button type="button" class="linklike" id="creditsBtn" aria-haspopup="dialog" data-i18n="credits">Credits</button></span><span class="gh-link"> &middot; <a href="https://github.com/mpascucci/practice-room" target="_blank" rel="noopener">GitHub</a></span> &middot; <a href="https://buymeacoffee.com/mpascucci" target="_blank" rel="noopener">&#9749; <span class="cof-long" data-i18n="coffeeLong">Buy me a coffee</span><span class="cof-q" hidden data-i18n="coffeeShort">coffee?</span></a> <span class="install-sep">&middot;</span> <button type="button" class="linklike" id="installBtn">&#10515; <span data-i18n="install">Install</span></button></footer>
  </div>

  <dialog id="creditsDialog" aria-labelledby="creditsTitle">
    <div class="credits-body" id="creditsBody" tabindex="0" data-i18n="loading">Loading…</div>
    <button type="button" class="dlg-btn dlg-close" id="creditsClose" data-i18n="close">Close</button>
  </dialog>

  <dialog id="shareDialog" aria-labelledby="shareTitle">
    <div class="share-body">
      <h2 id="shareTitle" data-i18n="shareTitle">Share Practice Room</h2>
      <img src="share-qr.svg" data-i18n-attr="alt:qrAlt" alt="QR code for https://mpascucci.github.io/practice-room/" width="220" height="220">
      <button type="button" class="dlg-btn" id="shareCopy"><span data-i18n="copyLink">Copy link</span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button>
      <button type="button" class="dlg-btn" id="shareNative" hidden data-i18n="share">Share<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    </div>
    <button type="button" class="dlg-btn dlg-close" id="shareClose" data-i18n="close">Close</button>
  </dialog>

  <dialog id="installDialog" aria-labelledby="installTitle">
    <div class="install-body">
      <h2 id="installTitle" data-i18n="installTitle">Install Practice Room</h2>
      <ol>
        <li><span data-i18n="installIos1">Tap the Share button</span> <svg class="ios-share" viewBox="0 0 24 24" width="1.2em" height="1.2em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9H6.5A1.5 1.5 0 0 0 5 10.5v9A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 17.5 9H16"/><path d="M12 14V3M8 6.5 12 3l4 3.5"/></svg></li>
        <li data-i18n="installIos2">Tap “Show more”</li>
        <li data-i18n="installIos3">Tap “Add to Home Screen”</li>
      </ol>
    </div>
    <button type="button" class="dlg-btn dlg-close" id="installClose" data-i18n="close">Close</button>
  </dialog>

  <script src="i18n.js" defer></script>
  <script src="strings.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
