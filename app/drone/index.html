<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1a17">
  <title>Drone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="tuner collapsed" id="tuner" aria-label="Tuner">
      <div class="curtain" id="tunerBody">
        <div class="curtain-inner">
          <div class="tuner-row">
            <div class="tuner-id">
              <p class="tuner-note idle" id="tunerNote" aria-live="off">listening...</p>
            </div>
            <div class="tuner-disks" id="tunerDisks" aria-hidden="true"><span class="disk"></span><span class="disk"></span><span class="disk"></span><span class="disk"></span><span class="disk mid"></span><span class="disk"></span><span class="disk"></span><span class="disk"></span><span class="disk"></span></div>
          <p class="tuner-hz" id="tunerHz">&nbsp;</p>
          </div>
          <p class="tuner-msg" id="tunerMsg" role="status" hidden></p>
        </div>
      </div>
      <button type="button" class="tuner-handle" id="tunerToggle" aria-expanded="false" aria-controls="tunerBody" title="Pull down the tuner">
        <svg class="fork" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3v8a3.5 3.5 0 0 0 7 0V3M12 14.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Tuner</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <header class="top">
      <h1 class="title">Drone</h1>

      <div class="transport">
        <div class="field">
          <label for="note">Base note</label>
          <select id="note"></select>
        </div>

        <div class="field">
          <label for="octave">Octave</label>
          <select id="octave">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>

        <button class="play" id="play" type="button" aria-pressed="false" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        </button>
      </div>

      <p class="freq" id="freq" aria-live="polite"></p>
    </header>


    <section class="harmonics" aria-label="Harmonics">
      <div class="harmonics-head">
        <button type="button" class="harm-toggle" id="harmToggle" aria-expanded="true" aria-controls="harmBody rows" title="Collapse / expand the harmonics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Harmonics</span>
        </button>
        <div class="bulk" id="harmBody">
          <button type="button" id="allOn">all on</button>
          <button type="button" id="allOff">all off</button>
          <button type="button" id="presetFlat" title="H0–H9 at the same volume (H10–H12 off)">flat</button>
          <button type="button" id="presetLinear" title="Volume decreasing linearly from H0 to H12">linear</button>
          <select id="instrument" class="instrument" aria-label="Instrument preset" title="Instrument preset"></select>
          <button type="button" id="reset">reset</button>
        </div>
      </div>
      <ol class="rows" id="rows"></ol>
    </section>

    <section class="sweep" aria-label="Harmonic sweep">
      <label class="switch sweep-toggle">
        <input type="checkbox" id="modOn">
        <span class="track"><span class="knob"></span></span>
        <span class="sweep-title">Sweep <small id="modRange">H1–H12</small></span>
      </label>
      <div class="field sweep-from">
        <label for="modFrom">From</label>
        <select id="modFrom"></select>
      </div>
      <div class="field">
        <label for="modRate">Rate <output id="modRateOut"></output></label>
        <input id="modRate" type="range" min="0" max="100" step="0.5">
      </div>
      <div class="field">
        <label for="modDepth">Depth <output id="modDepthOut"></output></label>
        <input id="modDepth" type="range" min="0" max="100">
      </div>
    </section>

    <section class="sweep swell" id="swellSection" aria-label="Brass swell">
      <label class="switch sweep-toggle">
        <input type="checkbox" id="swellOn">
        <span class="track"><span class="knob"></span></span>
        <span class="sweep-title">Swell</span>
      </label>
      <div class="field">
        <label for="swellRate">Rate <output id="swellRateOut"></output></label>
        <input id="swellRate" type="range" min="0" max="100" step="0.5">
      </div>
      <div class="field">
        <label for="swellDepth">Depth <output id="swellDepthOut"></output></label>
        <input id="swellDepth" type="range" min="0" max="100">
      </div>
    </section>
  </main>

  <template id="rowTpl">
    <li class="row">
      <label class="switch">
        <input type="checkbox" class="on">
        <span class="track"><span class="knob"></span></span>
        <span class="h"></span>
      </label>
      <span class="pitch"></span>
      <span class="hz"></span>
      <input type="range" class="vol" min="0" max="100">
      <span class="pct"></span>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
